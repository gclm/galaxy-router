<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2463EB" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#628EEE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="orbit-inner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2463EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93B8F7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gr-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2463EB"/>
      <stop offset="100%" stop-color="#628EEE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#628EEE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#628EEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93B8F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#93B8F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- 外层轨道环 -->
  <ellipse cx="256" cy="256" rx="210" ry="72" stroke="url(#orbit)" stroke-width="1.8" fill="none" transform="rotate(-30 256 256)" opacity="0.5"/>
  <ellipse cx="256" cy="256" rx="210" ry="72" stroke="url(#orbit)" stroke-width="1.8" fill="none" transform="rotate(30 256 256)" opacity="0.5"/>
  <ellipse cx="256" cy="256" rx="210" ry="72" stroke="url(#orbit)" stroke-width="1.8" fill="none" transform="rotate(90 256 256)" opacity="0.5"/>

  <!-- 内层轨道环 -->
  <ellipse cx="256" cy="256" rx="150" ry="52" stroke="url(#orbit-inner)" stroke-width="1.5" fill="none" transform="rotate(-30 256 256)" opacity="0.65"/>
  <ellipse cx="256" cy="256" rx="150" ry="52" stroke="url(#orbit-inner)" stroke-width="1.5" fill="none" transform="rotate(30 256 256)" opacity="0.65"/>
  <ellipse cx="256" cy="256" rx="150" ry="52" stroke="url(#orbit-inner)" stroke-width="1.5" fill="none" transform="rotate(90 256 256)" opacity="0.65"/>

  <!-- 外层轨道上的光点 -->
  <circle cx="410" cy="196" r="5" fill="#93B8F7" opacity="0.9"/>
  <circle cx="102" cy="316" r="5" fill="#93B8F7" opacity="0.9"/>
  <circle cx="196" cy="102" r="5" fill="#628EEE" opacity="0.8"/>
  <circle cx="316" cy="410" r="5" fill="#628EEE" opacity="0.8"/>
  <circle cx="316" cy="102" r="5" fill="#BED5F9" opacity="0.8"/>
  <circle cx="196" cy="410" r="5" fill="#BED5F9" opacity="0.8"/>
  <circle cx="102" cy="196" r="4.5" fill="#A8C9F8" opacity="0.8"/>
  <circle cx="410" cy="316" r="4.5" fill="#A8C9F8" opacity="0.8"/>

  <!-- 内层轨道上的光点 -->
  <circle cx="360" cy="210" r="4" fill="#BED5F9" opacity="0.7"/>
  <circle cx="152" cy="302" r="4" fill="#BED5F9" opacity="0.7"/>
  <circle cx="302" cy="152" r="4" fill="#BED5F9" opacity="0.7"/>
  <circle cx="210" cy="360" r="4" fill="#BED5F9" opacity="0.7"/>

  <!-- 路由连线 -->
  <line x1="256" y1="256" x2="410" y2="196" stroke="#628EEE" stroke-width="1" opacity="0.25"/>
  <line x1="256" y1="256" x2="102" y2="316" stroke="#628EEE" stroke-width="1" opacity="0.25"/>
  <line x1="256" y1="256" x2="196" y2="102" stroke="#93B8F7" stroke-width="1" opacity="0.25"/>
  <line x1="256" y1="256" x2="316" y2="410" stroke="#93B8F7" stroke-width="1" opacity="0.25"/>
  <line x1="256" y1="256" x2="316" y2="102" stroke="#BED5F9" stroke-width="1" opacity="0.25"/>
  <line x1="256" y1="256" x2="196" y2="410" stroke="#BED5F9" stroke-width="1" opacity="0.25"/>

  <!-- 中心光晕 -->
  <circle cx="256" cy="256" r="60" fill="url(#core-glow)"/>

  <!-- 中心 GR 徽章 -->
  <circle cx="256" cy="256" r="42" fill="url(#gr-fill)"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-1.5"
        fill="#FAFAFA">GR</text>
</svg>
