name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # 前端构建（只构建一次，共享给所有平台）
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  # 各平台构建二进制
  build:
    name: build (${{ matrix.target }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-arm64
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 缓存 cross + binstall 二进制
      - name: Cache cross toolchain
        if: runner.os == 'Linux'
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/bin/cargo-binstall
          key: cross-binstall-1

      - name: Install binstall
        if: runner.os == 'Linux' && steps.cache-cross.outputs.cache-hit != 'true'
        run: curl -LsSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cross
        if: runner.os == 'Linux' && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo binstall cross --locked --no-confirm

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zip

      # 下载前端产物（不重复构建）
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # 使用 cargo 直接构建（macOS）
      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      # 使用 cross 构建（Linux/Windows）
      - name: Build binary (Linux/Windows via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}

      # 打包
      - name: Package archive
        run: |
          mkdir -p build/dist
          target="${{ matrix.target }}"
          artifact="${{ matrix.artifact }}"
          ext=""
          if [[ "$target" == *windows* ]]; then ext=".exe"; fi
          cp "target/${target}/release/galaxy-router${ext}" build/dist/galaxy-router
          cd build/dist && zip "galaxy-router-${artifact}.zip" galaxy-router

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: galaxy-router-${{ matrix.artifact }}
          path: build/dist/galaxy-router-${{ matrix.artifact }}.zip

  # 发布到 GitHub Release
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: build/dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd build/dist
          shasum -a 256 *.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      # 从 conventional commits 生成格式化 Release Notes
      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bash .github/scripts/generate-release-notes.sh)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release-info.json
        env:
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p build/dist
          jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$RELEASE_BODY" \
            --arg html_url "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag_name:$tag, name:$name, body:$body, html_url:$html_url, published_at:$published_at}' \
            > build/dist/release-info.json
          echo "Generated release-info.json:"
          cat build/dist/release-info.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            build/dist/*.zip
            build/dist/checksums-sha256.txt
            build/dist/release-info.json

  # Docker 镜像构建
  docker:
    name: docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Prepare binaries
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          unzip artifacts/galaxy-router-linux-amd64/galaxy-router-linux-amd64.zip -d dist/linux-amd64
          unzip artifacts/galaxy-router-linux-arm64/galaxy-router-linux-arm64.zip -d dist/linux-arm64
          chmod +x dist/linux-amd64/galaxy-router dist/linux-arm64/galaxy-router

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
