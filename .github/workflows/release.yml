name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # 前端构建（只构建一次，共享给所有平台）
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # 各平台构建二进制
  build:
    name: build (${{ matrix.target }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-arm64
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 cross 工具（避免每次安装）
      - name: Cache cross
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cross-

      - name: Install cross (Linux/Windows)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cross &> /dev/null; then
            cargo install cross --locked
          fi

      # 使用 sccache 加速编译
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zip

      # 下载前端产物（不重复构建）
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 使用 make release 构建（macOS）
      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: make release

      # 使用 cross 构建（Linux/Windows）
      - name: Build binary (Linux/Windows via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}

      # 打包
      - name: Package archive
        run: |
          mkdir -p build/dist
          target="${{ matrix.target }}"
          artifact="${{ matrix.artifact }}"
          ext=""
          if [[ "$target" == *windows* ]]; then ext=".exe"; fi
          cp "target/${target}/release/galaxy-router${ext}" build/dist/galaxy-router
          cd build/dist && zip "galaxy-router-${artifact}.zip" galaxy-router

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-router-${{ matrix.artifact }}
          path: build/dist/galaxy-router-${{ matrix.artifact }}.zip

  # 发布到 GitHub Release
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd build/dist
          shasum -a 256 *.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.zip
            build/dist/checksums-sha256.txt
          generate_release_notes: true

  # Docker 镜像构建
  docker:
    name: docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare binaries
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          unzip artifacts/galaxy-router-linux-amd64/galaxy-router-linux-amd64.zip -d dist/linux-amd64
          unzip artifacts/galaxy-router-linux-arm64/galaxy-router-linux-arm64.zip -d dist/linux-arm64
          chmod +x dist/linux-amd64/galaxy-router dist/linux-arm64/galaxy-router

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
