name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 前端构建（共享给后续 job）
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  # 后端 lint + 测试 + 覆盖率（合并为一个 job，共享编译产物）
  backend:
    name: backend
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # lint（不跑测试，tarpaulin 会跑）
      - name: Clippy
        run: cargo clippy -- -D warnings

      # 缓存 tarpaulin 预编译二进制（binstall 下载 ~5s，cargo install 编译 ~3min）
      - name: Cache tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-tarpaulin
            ~/.cargo/bin/cargo-binstall
          key: tarpaulin-binstall-0.35.4

      - name: Install binstall
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: curl -LsSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo binstall cargo-tarpaulin --version 0.35.4 --locked --no-confirm

      # tarpaulin 兼管测试 + 覆盖率（不重复跑测试）
      # --fail-under 锁底：当前 ~48.6%，待补测试后上调
      - name: Test + Coverage gate
        run: cargo tarpaulin --all-targets --skip-clean --timeout 300 --fail-under 48 --out Xml
