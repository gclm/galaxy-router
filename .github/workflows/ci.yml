name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 前端构建（共享给后续 job）
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build

      # 上传前端产物，供后续 job 使用
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # 后端检查（使用 make check）
  backend:
    name: backend
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # 下载前端产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 使用 make check 统一入口
      - run: make check

  # 覆盖率（独立 job，不使用 make）
  coverage:
    name: coverage gate
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # 下载前端产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.35.4 --locked

      - name: Run coverage gate
        # --fail-under 锁底：协议转换重构后覆盖率下降，当前 ~48.6%，待补测试后上调
        # --out Xml 输出供 GitHub Actions summary 渲染
        # --timeout 防止 SQLite 并发死锁卡死 CI
        run: cargo tarpaulin --all-targets --skip-clean --timeout 300 --fail-under 48 --out Xml
