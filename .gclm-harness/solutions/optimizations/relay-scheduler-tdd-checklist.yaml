refactor: relay-scheduler-tdd
status: green
strategy: tdd
steps:
  - id: P1-S1
    status: green
    name: scheduler scoring pure functions
    phase: scheduler-core
    tdd:
      red: add failing tests for candidate scoring and top-k ordering
      green: implement minimal scoring/top-k API under proxy scheduler module
      refactor: simplify names and make weights explicit
    validation:
      - cargo test scheduler_scoring --test scheduler_scoring_tdd
  - id: P1-S2
    status: green
    name: deterministic weighted top-k order
    phase: scheduler-core
    tdd:
      red: add failing tests for no duplicate/no missing/reproducible order
      green: implement seeded weighted order
      refactor: isolate RNG helper
    validation:
      - cargo test scheduler_weighted --test scheduler_scoring_tdd
  - id: P2-S1
    status: green
    name: channel capacity permit
    phase: capacity
    tdd:
      red: add failing tests for unlimited, max limit, drop release
      green: implement ChannelCapacityManager
      refactor: integrate with load snapshot
    validation:
      - cargo test scheduler_capacity --test scheduler_capacity_tdd
  - id: P3-S1
    status: green
    name: attempt trace builder
    phase: trace
    tdd:
      red: add failing tests for skip/circuit/success/failure trace sequence
      green: implement AttemptTrace and builder
      refactor: align fields with usage log attempts JSON
    validation:
      - cargo test scheduler_trace --test scheduler_trace_tdd
  - id: P4-S1
    status: green
    name: relay run fake executor lifecycle
    phase: relay
    tdd:
      red: add failing tests for retry/success/all-failed metrics with fake executor
      green: implement RelayRun skeleton with dependency traits
      refactor: separate run and attempt modules
    validation:
      - cargo test relay_run --test relay_run_tdd
  - id: P5-S1
    status: green
    name: relay pipeline passthrough
    phase: pipeline
    tdd:
      red: add failing characterization test for OpenAI Chat passthrough request/response
      green: implement RelayPipeline passthrough wrapper using existing prepare/execute behavior
      refactor: move conversion decisions into pipeline
    validation:
      - cargo test relay_pipeline_passthrough --test relay_pipeline_tdd
  - id: P5-S2
    status: green
    name: relay pipeline conversion
    phase: pipeline
    tdd:
      red: add failing characterization tests for Anthropic to OpenAI and OpenAI to Anthropic
      green: route conversion through single pipeline
      refactor: shrink prepare.rs conversion responsibilities
    validation:
      - cargo test relay_pipeline_conversion --test relay_pipeline_tdd

notes:
  - 2026-06-08: P1/P2 completed modules migrated from proxy::scheduler::* to root scheduler::*; proxy scheduler kept as transitional task scheduler only.
  - 2026-06-08: P3-S1 completed root scheduler::trace AttemptTraceBuilder with stable snake_case status serialization.
  - 2026-06-08: P4-S1 completed root relay::run skeleton with fake executor lifecycle, retry, all-failed, capacity-skip, and trace coverage.
  - 2026-06-08: P5-S1 completed root relay::pipeline passthrough wrapper with OpenAI Chat request/response characterization and model rewrite only.
  - 2026-06-08: P5-S2 completed relay::pipeline conversion via existing protocol Inbound/Outbound for OpenAI Chat <-> Anthropic request/response path.
